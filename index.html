<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 跑步軌跡與步態生物力學檢測系統</title>
  <!-- 引入 MediaPipe Pose 與繪圖工具 -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
  <!-- 引入 Chart.js 用於即時波形圖 -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-green: #10b981;
      --accent-warn: #f59e0b;
      --accent-danger: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); padding: 20px; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #334155; padding-bottom: 15px; flex-wrap: wrap; gap: 10px; }
    h1 { font-size: 1.5rem; color: var(--accent); display: flex; align-items: center; gap: 10px; }
    .controls { display: flex; gap: 10px; flex-wrap: wrap; }
    button, .file-label {
      background: #334155; color: white; border: 1px solid #475569; padding: 8px 14px;
      border-radius: 6px; cursor: pointer; font-size: 0.9rem; transition: 0.2s; display: inline-flex; align-items: center; gap: 6px;
    }
    button:hover, .file-label:hover { background: var(--accent); color: #0f172a; font-weight: 600; }
    button.active { background: var(--accent-green); color: #0f172a; border-color: var(--accent-green); font-weight: bold; }
    input[type="file"] { display: none; }

    .main-grid { display: grid; grid-template-columns: 1.6fr 1fr; gap: 20px; }
    @media (max-width: 960px) { .main-grid { grid-template-columns: 1fr; } }

    .video-container {
      position: relative; background: #000; border-radius: 12px; overflow: hidden;
      border: 1px solid #334155; aspect-ratio: 16/9; display: flex; align-items: center; justify-content: center;
    }
    video { display: none; }
    canvas { width: 100%; height: 100%; object-fit: contain; }
    .overlay-badge {
      position: absolute; top: 12px; left: 12px; background: rgba(15, 23, 42, 0.8);
      padding: 6px 12px; border-radius: 20px; font-size: 0.8rem; border: 1px solid var(--accent);
    }
    .playback-bar {
      display: flex; gap: 10px; align-items: center; margin-top: 10px; background: var(--card-bg);
      padding: 10px 15px; border-radius: 8px; flex-wrap: wrap;
    }

    .dashboard { display: flex; flex-direction: column; gap: 15px; }
    .metrics-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .metric-card {
      background: var(--card-bg); padding: 15px; border-radius: 10px; border-left: 4px solid var(--accent);
    }
    .metric-title { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 5px; }
    .metric-value { font-size: 1.6rem; font-weight: 700; }
    .metric-sub { font-size: 0.75rem; color: var(--accent-green); margin-top: 4px; }

    .feedback-box {
      background: var(--card-bg); padding: 15px; border-radius: 10px; border: 1px solid #334155;
    }
    .feedback-box h3 { font-size: 0.95rem; margin-bottom: 8px; color: var(--accent); }
    #aiFeedback { font-size: 0.9rem; line-height: 1.5; color: #e2e8f0; }

    .chart-box { background: var(--card-bg); padding: 15px; border-radius: 10px; height: 210px; }
    .legend-toggles { display: flex; gap: 12px; font-size: 0.85rem; margin-left: auto; }
    .legend-toggles label { display: flex; align-items: center; gap: 4px; cursor: pointer; }
  </style>
</head>
<body>

<header>
  <h1>🏃‍♂️ AI 跑步軌跡與步態力學分析系統</h1>
  <div class="controls">
    <button id="btnWebcam">📷 開啟即時攝影機</button>
    <label class="file-label">
      📁 上傳跑步影片
      <input type="file" id="videoUpload" accept="video/*" />
    </label>
    <button id="btnClearTrail">🧹 清除軌跡殘影</button>
    <button id="btnExportCSV">📊 匯出 CSV 數據</button>
  </div>
</header>

<div class="main-grid">
  <!-- 左側：影像與骨架軌跡畫布 -->
  <div>
    <div class="video-container">
      <div class="overlay-badge" id="statusBadge">系統就緒：請選擇攝影機或上傳側面跑步影片</div>
      <video id="inputVideo" playsinline></video>
      <canvas id="outputCanvas" width="1280" height="720"></canvas>
    </div>
    <div class="playback-bar">
      <button id="btnPlayPause">⏯️ 播放 / 暫停</button>
      <span>速度：</span>
      <button class="speed-btn" data-speed="0.25">0.25x (慢動作)</button>
      <button class="speed-btn" data-speed="0.5">0.5x</button>
      <button class="speed-btn active" data-speed="1.0">1.0x</button>
      <div class="legend-toggles">
        <label><input type="checkbox" id="chkAnkleTrail" checked> 腳踝軌跡 (青)</label>
        <label><input type="checkbox" id="chkHipTrail" checked> 重心起伏 (黃)</label>
      </div>
    </div>
  </div>

  <!-- 右側：數據儀表板與 AI 診斷 -->
  <div class="dashboard">
    <div class="metrics-grid">
      <div class="metric-card">
        <div class="metric-title">即時步頻 (Cadence)</div>
        <div class="metric-value" id="valCadence">-- <span style="font-size:0.9rem">spm</span></div>
        <div class="metric-sub">理想區間: 170 - 185 spm</div>
      </div>
      <div class="metric-card" style="border-left-color: var(--accent-green);">
        <div class="metric-title">軀幹前傾角 (Trunk Lean)</div>
        <div class="metric-value" id="valTrunk">--°</div>
        <div class="metric-sub">理想區間: 5° - 12°</div>
      </div>
      <div class="metric-card" style="border-left-color: var(--accent-warn);">
        <div class="metric-title">右膝彎曲角 (Knee Angle)</div>
        <div class="metric-value" id="valKnee">--°</div>
        <div class="metric-sub" id="subKnee">擺盪期最大摺疊追蹤</div>
      </div>
      <div class="metric-card" style="border-left-color: #a855f7;">
        <div class="metric-title">骨盆垂直振幅 (相對像素)</div>
        <div class="metric-value" id="valOscillation">-- <span style="font-size:0.9rem">px</span></div>
        <div class="metric-sub">越低代表能量損耗越少</div>
      </div>
    </div>

    <div class="feedback-box">
      <h3>🤖 AI 步態生物力學即時診斷</h3>
      <div id="aiFeedback">等待骨架偵測中... 建議使用「側面視角（Sagittal Plane）」拍攝全身跑步畫面以獲得最準確的角度分析。</div>
    </div>

    <div class="chart-box">
      <canvas id="kinematicChart"></canvas>
    </div>
  </div>
</div>

<script>
  const videoElement = document.getElementById('inputVideo');
  const canvasElement = document.getElementById('outputCanvas');
  const canvasCtx = canvasElement.getContext('2d');
  const statusBadge = document.getElementById('statusBadge');

  // 軌跡與歷史數據儲存
  let ankleTrail = [];
  let hipTrail = [];
  const MAX_TRAIL_LENGTH = 60;
  let recordedData = []; // 用於匯出 CSV

  // 步頻計算變數
  let stepTimestamps = [];
  let lastAnkleY = null;
  let goingDown = false;

  // 垂直振幅計算變數
  let hipYWindow = [];

  // 初始化即時折線圖 (Chart.js)
  const ctxChart = document.getElementById('kinematicChart').getContext('2d');
  const kinematicChart = new Chart(ctxChart, {
    type: 'line',
    data: {
      labels: [],
      datasets: [
        { label: '膝關節角度 (°)', data: [], borderColor: '#f59e0b', tension: 0.3, pointRadius: 0 },
        { label: '軀幹前傾角 (°)', data: [], borderColor: '#10b981', tension: 0.3, pointRadius: 0 }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: false,
      scales: {
        x: { display: false },
        y: { min: 0, max: 180, grid: { color: '#334155' }, ticks: { color: '#94a3b8' } }
      },
      plugins: { legend: { labels: { color: '#f8fafc', font: { size: 11 } } } }
    }
  });

  // 計算三點夾角 (A-B-C，B為頂點)
  function calculateAngle(a, b, c) {
    const radians = Math.atan2(c.y - b.y, c.x - b.x) - Math.atan2(a.y - b.y, a.x - b.x);
    let angle = Math.abs(radians * 180.0 / Math.PI);
    if (angle > 180.0) angle = 360 - angle;
    return Math.round(angle);
  }

  // 計算兩點連線與垂直線的夾角 (軀幹前傾)
  function calculateTrunkLean(shoulder, hip) {
    const dx = shoulder.x - hip.x;
    const dy = hip.y - shoulder.y; // 畫面座標 y 向下為正
    const angle = Math.abs(Math.atan2(dx, dy) * 180.0 / Math.PI);
    return Math.round(angle);
  }

  // MediaPipe Pose 結果處理核心
  function onResults(results) {
    canvasCtx.save();
    canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
    canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

    if (results.poseLandmarks) {
      const lm = results.poseLandmarks;
      const w = canvasElement.width;
      const h = canvasElement.height;

      // 繪製基礎骨架
      drawConnectors(canvasCtx, lm, POSE_CONNECTIONS, { color: 'rgba(255,255,255,0.4)', lineWidth: 2 });
      drawLandmarks(canvasCtx, lm, { color: '#38bdf8', lineWidth: 1, radius: 3 });

      // 取得右側關鍵點 (12:右肩, 24:右髖, 26:右膝, 28:右踝)
      const shoulder = lm[12];
      const hip = lm[24];
      const knee = lm[26];
      const ankle = lm[28];

      if (hip.visibility > 0.5 && knee.visibility > 0.5 && ankle.visibility > 0.5) {
        // 1. 計算關節角度
        const kneeAngle = calculateAngle(hip, knee, ankle);
        const trunkAngle = calculateTrunkLean(shoulder, hip);

        document.getElementById('valKnee').innerText = `${kneeAngle}°`;
        document.getElementById('valTrunk').innerText = `${trunkAngle}°`;

        // 2. 記錄與繪製軌跡
        const anklePx = { x: ankle.x * w, y: ankle.y * h };
        const hipPx = { x: hip.x * w, y: hip.y * h };

        ankleTrail.push(anklePx);
        hipTrail.push(hipPx);
        if (ankleTrail.length > MAX_TRAIL_LENGTH) ankleTrail.shift();
        if (hipTrail.length > MAX_TRAIL_LENGTH) hipTrail.shift();

        if (document.getElementById('chkAnkleTrail').checked) {
          drawTrail(ankleTrail, '#38bdf8', 4);
        }
        if (document.getElementById('chkHipTrail').checked) {
          drawTrail(hipTrail, '#facc15', 3);
        }

        // 3. 計算垂直振幅 (近 30 幀的 Y 軸高低差)
        hipYWindow.push(hipPx.y);
        if (hipYWindow.length > 30) hipYWindow.shift();
        const oscillation = Math.round(Math.max(...hipYWindow) - Math.min(...hipYWindow));
        document.getElementById('valOscillation').innerHTML = `${oscillation} <span style="font-size:0.9rem">px</span>`;

        // 4. 簡易步頻偵測 (偵測腳踝 Y 軸波谷觸地瞬間)
        if (lastAnkleY !== null) {
          if (anklePx.y > lastAnkleY) {
            goingDown = true;
          } else if (goingDown && anklePx.y < lastAnkleY) {
            // 觸底反彈瞬間
            goingDown = false;
            const now = performance.now();
            stepTimestamps.push(now);
            // 保留最近 6 秒內的步數
            stepTimestamps = stepTimestamps.filter(t => now - t < 6000);
            if (stepTimestamps.length >= 2) {
              const durationSec = (stepTimestamps[stepTimestamps.length - 1] - stepTimestamps[0]) / 1000;
              // 單腳週期 * 2 = 雙腳總步頻
              const cadence = Math.round(((stepTimestamps.length - 1) / durationSec) * 60 * 2);
              if (cadence > 100 && cadence < 240) {
                document.getElementById('valCadence').innerHTML = `${cadence} <span style="font-size:0.9rem">spm</span>`;
              }
            }
          }
        }
        lastAnkleY = anklePx.y;

        // 5. 更新即時圖表與 CSV 紀錄
        updateChart(kneeAngle, trunkAngle);
        recordedData.push({
          time: (performance.now() / 1000).toFixed(2),
          kneeAngle,
          trunkAngle,
          oscillation,
          ankleX: Math.round(anklePx.x),
          ankleY: Math.round(anklePx.y)
        });

        // 6. AI 步態診斷建議
        generateAIFeedback(kneeAngle, trunkAngle, oscillation);
      }
    }
    canvasCtx.restore();
  }

  function drawTrail(points, color, width) {
    if (points.length < 2) return;
    canvasCtx.beginPath();
    canvasCtx.strokeStyle = color;
    canvasCtx.lineWidth = width;
    canvasCtx.lineCap = 'round';
    for (let i = 0; i < points.length; i++) {
      if (i === 0) canvasCtx.moveTo(points[i].x, points[i].y);
      else canvasCtx.lineTo(points[i].x, points[i].y);
    }
    canvasCtx.stroke();
  }

  function updateChart(knee, trunk) {
    const labels = kinematicChart.data.labels;
    labels.push('');
    kinematicChart.data.datasets[0].data.push(knee);
    kinematicChart.data.datasets[1].data.push(trunk);
    if (labels.length > 50) {
      labels.shift();
      kinematicChart.data.datasets[0].data.shift();
      kinematicChart.data.datasets[1].data.shift();
    }
    kinematicChart.update();
  }

  function generateAIFeedback(knee, trunk, oscillation) {
    let notes = [];
    if (trunk < 3) notes.push("⚠️ 軀幹過於直立（前傾不足），可能導致跨步煞車效應。");
    else if (trunk > 18) notes.push("⚠️ 軀幹過度前傾（彎腰），容易造成下背代償疲勞。");
    else notes.push("✅ 軀幹前傾角度良好，重心轉換順暢。");

    if (knee > 168) notes.push("💡 偵測到腿部接近伸直狀態，請確認著地點是否落在重心正下方，避免膝關節承受過大衝擊。");
    if (oscillation > 65) notes.push("⚠️ 垂直振幅偏大，建議提高步頻以減少上下彈跳的能量損耗。");

    document.getElementById('aiFeedback').innerHTML = notes.join('<br>');
  }

  // 初始化 MediaPipe Pose
  const pose = new Pose({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
  });
  pose.setOptions({
    modelComplexity: 1,
    smoothLandmarks: true,
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
  });
  pose.onResults(onResults);

  // 模式 1：開啟攝影機
  let camera = null;
  document.getElementById('btnWebcam').addEventListener('click', () => {
    statusBadge.innerText = "📷 即時攝影機偵測中...";
    camera = new Camera(videoElement, {
      onFrame: async () => { await pose.send({ image: videoElement }); },
      width: 1280, height: 720
    });
    camera.start();
  });

  // 模式 2：上傳影片分析
  let isProcessingVideo = false;
  document.getElementById('videoUpload').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (camera) camera.stop();

    const url = URL.createObjectURL(file);
    videoElement.src = url;
    videoElement.loop = true;
    videoElement.play();
    statusBadge.innerText = `🎬 分析影片中：${file.name}`;

    async function processFrame() {
      if (!videoElement.paused && !videoElement.ended) {
        await pose.send({ image: videoElement });
      }
      requestAnimationFrame(processFrame);
    }
    if (!isProcessingVideo) {
      isProcessingVideo = true;
      processFrame();
    }
  });

  // 播放控制與慢動作切換
  document.getElementById('btnPlayPause').addEventListener('click', () => {
    if (videoElement.paused) videoElement.play();
    else videoElement.pause();
  });

  document.querySelectorAll('.speed-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      videoElement.playbackRate = parseFloat(e.target.dataset.speed);
    });
  });

  // 清除軌跡
  document.getElementById('btnClearTrail').addEventListener('click', () => {
    ankleTrail = [];
    hipTrail = [];
    recordedData = [];
  });

  // 匯出 CSV
  document.getElementById('btnExportCSV').addEventListener('click', () => {
    if (recordedData.length === 0) return alert("尚無偵測數據可匯出！");
    let csv = "Time(s),KneeAngle(deg),TrunkLean(deg),VerticalOscillation(px),AnkleX,AnkleY\n";
    recordedData.forEach(r => {
      csv += `${r.time},${r.kneeAngle},${r.trunkAngle},${r.oscillation},${r.ankleX},${r.ankleY}\n`;
    });
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = `running_gait_analysis_${Date.now()}.csv`;
    link.click();
  });
</script>
</body>
</html>
